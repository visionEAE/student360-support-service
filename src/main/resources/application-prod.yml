# Production deltas only. This service is both a callee (expected-audience) and a caller of
# core and lms (audience-map), so it gets a validator and a provider.
student360:
  security:
    service-token:
      mode: google
      secret: ""
      expected-audience: ${SERVICE_AUDIENCE}
      audience-map:
        core-service: ${CORE_SERVICE_URL}
        lms-service: ${LMS_SERVICE_URL}
